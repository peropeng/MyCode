<text x="57" y="412" font-size="25" text-anchor="start" style="fill:white" class="bold">RQ1  如何形成有效的步骤责任排序？</text>
<text x="59" y="460" font-size="24" text-anchor="start" style="fill:#222222">如何结合步骤语义、可观察关系与候选</text>
