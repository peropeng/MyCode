<text x="59" y="293" font-size="25" text-anchor="start" style="fill:#222222">形成步骤级完整责任次序，</text>
<text x="59" y="327" font-size="25" text-anchor="start" style="fill:#222222">提高失败轨迹排序的准确性与稳定性。</text>
