<text x="779" y="293" font-size="25" text-anchor="start" style="fill:#222222">在共同资源约束下恢复失败执行，</text>
<text x="779" y="327" font-size="25" text-anchor="start" style="fill:#222222">并控制对已验证行为的损害。</text>
