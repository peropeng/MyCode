<text x="700" y="107" font-size="26" text-anchor="middle" style="fill:#222222">建立连接步骤级失败诊断与执行恢复的方法，</text>
<text x="700" y="140" font-size="26" text-anchor="middle" style="fill:#222222">提高智能体失败分析质量，并检验诊断对恢复效果的实际作用。</text>
