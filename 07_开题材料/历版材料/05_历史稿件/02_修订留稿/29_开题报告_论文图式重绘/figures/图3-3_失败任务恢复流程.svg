<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1550" viewBox="0 0 1180 1550" font-family="Microsoft YaHei,SimHei,sans-serif"><defs><marker id="a456F99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456F99"/></marker><marker id="a397F7C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#397F7C"/></marker><marker id="a7B6B9E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7B6B9E"/></marker><marker id="aAF713E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AF713E"/></marker><marker id="a667E8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#667E8C"/></marker><marker id="aA15F62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A15F62"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="220" y="25" width="600" height="120" rx="8" fill="#F1F6FB" stroke="#456F99" stroke-width="2"/><rect x="220" y="220" width="600" height="125" rx="8" fill="#F1F6FB" stroke="#456F99" stroke-width="2"/><circle cx="110" cy="282" r="25" stroke="#456F99" stroke-width="2" fill="#F1F6FB"/><rect x="220" y="410" width="600" height="125" rx="8" fill="#F5F2FA" stroke="#7B6B9E" stroke-width="2"/><rect x="920" y="410" width="240" height="125" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2"/><circle cx="1040" cy="607" r="25" stroke="#A15F62" stroke-width="2" fill="#FAF1F1"/><rect x="220" y="620" width="600" height="155" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2"/><rect x="920" y="690" width="240" height="120" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2"/><rect x="220" y="865" width="600" height="165" rx="8" fill="#EFF8F6" stroke="#397F7C" stroke-width="2"/><rect x="220" y="1110" width="600" height="125" rx="8" fill="#F4F7F9" stroke="#667E8C" stroke-width="2"/><circle cx="110" cy="1172" r="25" stroke="#A15F62" stroke-width="2" fill="#FAF1F1"/><circle cx="1040" cy="1172" r="25" stroke="#456F99" stroke-width="2" fill="#F1F6FB"/><rect x="220" y="1310" width="600" height="125" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2"/><polyline points="520,145 520,220" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="135,282 220,282" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="520,345 520,410" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)"/><polyline points="820,472 920,472" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="1040,535 1040,581" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="520,535 520,620" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)"/><polyline points="820,750 920,750" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="520,775 520,865" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)"/><polyline points="520,1030 520,1110" fill="none" stroke="#667E8C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a667E8C)"/><polyline points="135,1172 220,1172" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="820,1172 1015,1172" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="520,1235 520,1310" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)"/><text x="520.0" y="62" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">初始化</text><text x="520.0" y="101" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">读取失败代码、轨迹与可见测试</text><text x="520.0" y="132" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">计算一次责任排序，记录初始通过项</text><text x="536" y="187" font-size="21" fill="#456F99" font-weight="400" text-anchor="start">排序与失败初态</text><text x="520.0" y="257" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">① 修复上下文构建</text><text x="520.0" y="296" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">按排序选取历史编辑，读取当前源码</text><text x="520.0" y="327" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">加入原问题及此前可见执行反馈</text><text x="110" y="291" font-size="26" fill="#456F99" font-weight="700" text-anchor="middle">A</text><text x="110" y="337" font-size="19" fill="#456F99" font-weight="400" text-anchor="middle">下一轮入口</text><text x="536" y="385" font-size="21" fill="#7B6B9E" font-weight="400" text-anchor="start">修复上下文</text><text x="520.0" y="447" font-size="29" fill="#7B6B9E" font-weight="700" text-anchor="middle">② 生成并应用候选补丁</text><text x="520.0" y="486" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">生成修改内容，检查格式与匹配位置</text><text x="520.0" y="517" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">成功应用后得到候选代码 S′</text><text x="1040.0" y="447" font-size="25" fill="#A15F62" font-weight="700" text-anchor="middle">应用失败</text><text x="1040.0" y="486" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">保留此前代码</text><text x="1040.0" y="517" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">记录应用错误</text><text x="870" y="451" font-size="20" fill="#A15F62" font-weight="400" text-anchor="middle">失败</text><text x="1040" y="616" font-size="26" fill="#A15F62" font-weight="700" text-anchor="middle">C</text><text x="1040" y="656" font-size="19" fill="#A15F62" font-weight="400" text-anchor="middle">转至停止检查</text><text x="536" y="586" font-size="21" fill="#7B6B9E" font-weight="400" text-anchor="start">应用成功</text><text x="520.0" y="657" font-size="28" fill="#AF713E" font-weight="700" text-anchor="middle">③ 基于测试的补丁验证</text><text x="520.0" y="696" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">执行可见目标测试和回归测试</text><text x="520.0" y="727" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">检查：B ∪ Hₜ ⊆ Pass(S′)</text><text x="520.0" y="758" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">初态回归项及累计已通过目标须继续通过</text><text x="1040.0" y="727" font-size="24" fill="#A15F62" font-weight="700" text-anchor="middle">中止并保存</text><text x="1040.0" y="766" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">保留此前代码</text><text x="1040.0" y="797" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">记录不确定原因</text><text x="870" y="727" font-size="17" fill="#A15F62" font-weight="400" text-anchor="middle">缺失／未知</text><text x="536" y="825" font-size="21" fill="#AF713E" font-weight="400" text-anchor="start">测试结果完整、确定</text><text x="520" y="902" font-size="29" fill="#397F7C" font-weight="700" text-anchor="middle">更新当前代码与通过集合</text><text x="520" y="946" font-size="23" fill="#397F7C" font-weight="400" text-anchor="middle">条件满足：采用候选，累计新通过目标</text><text x="520" y="987" font-size="23" fill="#A15F62" font-weight="400" text-anchor="middle">条件不满足：恢复此前代码，集合不变</text><text x="536" y="1076" font-size="21" fill="#667E8C" font-weight="400" text-anchor="start">保存本轮反馈</text><text x="520.0" y="1147" font-size="29" fill="#667E8C" font-weight="700" text-anchor="middle">④ 检查停止条件</text><text x="520.0" y="1186" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">目标全过、尝试到限或资源到限</text><text x="520.0" y="1217" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">依据当前状态及剩余资源判断</text><text x="110" y="1181" font-size="26" fill="#A15F62" font-weight="700" text-anchor="middle">C</text><text x="920" y="1147" font-size="18" fill="#456F99" font-weight="400" text-anchor="middle">未达到：进入下一轮</text><text x="1040" y="1181" font-size="26" fill="#456F99" font-weight="700" text-anchor="middle">A</text><text x="1040" y="1225" font-size="19" fill="#456F99" font-weight="400" text-anchor="middle">返回同名入口 A</text><text x="536" y="1281" font-size="21" fill="#AF713E" font-weight="400" text-anchor="start">达到停止条件</text><text x="520.0" y="1347" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">选定交付并独立验收</text><text x="520.0" y="1386" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">按已有可见结果选择代码</text><text x="520.0" y="1417" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">独立验收判断失败任务是否恢复成功</text><text x="590" y="1484" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">A、C 为同名流程连接点：A 返回①；C 进入④。</text><text x="590" y="1521" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">B 为初态回归通过集合；Hₜ 为累计通过的目标集合。</text></svg>