<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1030" viewBox="0 0 1920 1030"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif" fill="#111"><text x="960" y="43" font-size="34" text-anchor="middle">责任排序与执行恢复的实验设计</text><rect x="40" y="100" width="510" height="150" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="295" y="142" font-size="30" text-anchor="middle">数据来源与资格核验</text><text x="295" y="180" font-size="25" text-anchor="middle">AFTraj / AgenTracer / SWE-Gym</text><text x="295" y="216" font-size="25" text-anchor="middle">步骤映射、任务身份与执行资格</text><rect x="700" y="100" width="520" height="150" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="960" y="142" font-size="30" text-anchor="middle">按源任务分组并隔离用途</text><text x="960" y="180" font-size="25" text-anchor="middle">训练、验证、开发评价、独立确认</text><text x="960" y="216" font-size="25" text-anchor="middle">确认来源先核重叠与开发曝光</text><rect x="1380" y="100" width="500" height="150" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1630" y="142" font-size="30" text-anchor="middle">固定共同评价规则</text><text x="1630" y="180" font-size="25" text-anchor="middle">方法参数、可见信息、验收标准</text><text x="1630" y="216" font-size="25" text-anchor="middle">预算与重复次数在确认前确定</text><path d="M550 175H700" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1220 175H1380" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1630 250V295H295V340" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="340" width="510" height="170" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="295" y="382" font-size="30" text-anchor="middle">RQ1：责任排序训练与评价</text><text x="295" y="420" font-size="25" text-anchor="middle">本文 / StepFinder / AA / BS</text><text x="295" y="456" font-size="25" text-anchor="middle">定位、完整排名与端到端开销</text><text x="295" y="492" font-size="25" text-anchor="middle">单位置方法只比较原生指标</text><rect x="700" y="340" width="520" height="170" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="960" y="382" font-size="30" text-anchor="middle">排序到恢复的衔接核对</text><text x="960" y="420" font-size="25" text-anchor="middle">选定模型 → 排序产物 → 实际输入</text><text x="960" y="456" font-size="25" text-anchor="middle">恢复任务不参与对应模型训练</text><text x="960" y="492" font-size="25" text-anchor="middle">诊断证据映射到当前状态</text><rect x="1380" y="340" width="500" height="170" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1630" y="382" font-size="30" text-anchor="middle">RQ2：完整恢复共同任务比较</text><text x="1630" y="420" font-size="25" text-anchor="middle">本文 / Agentless / EnAgent / AOrchestra</text><text x="1630" y="456" font-size="25" text-anchor="middle">相同初态、后端、许可与总资源</text><text x="1630" y="492" font-size="25" text-anchor="middle">保留各方法核心与选择机制</text><path d="M550 425H700" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1220 425H1380" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1630 510V560H1250V610" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><rect x="980" y="610" width="560" height="170" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1260" y="652" font-size="30" text-anchor="middle">质量、预算与资源评价</text><text x="1260" y="690" font-size="25" text-anchor="middle">交付状态的独立验收与RSR(B)</text><text x="1260" y="726" font-size="25" text-anchor="middle">时间 / token曲线、自然终态</text><text x="1260" y="762" font-size="25" text-anchor="middle">所有子智能体与候选的累计成本</text><path d="M980 695H780" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="610" width="740" height="170" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="410" y="652" font-size="30" text-anchor="middle">机制与稳健性分析</text><text x="410" y="690" font-size="25" text-anchor="middle">诊断 × 反馈、关系上下文、状态映射与身份保护</text><text x="410" y="726" font-size="25" text-anchor="middle">固定恢复器的模块控制与受控压力场景</text><text x="410" y="762" font-size="25" text-anchor="middle">自然任务与机制样本分别报告</text><path d="M410 780V835H960V875" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1260 780V835H960" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><rect x="430" y="875" width="1060" height="115" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="960" y="917" font-size="30" text-anchor="middle">任务级配对结果与适用条件</text><text x="960" y="955" font-size="25" text-anchor="middle">保留全部预定重复、负结果与异常；按源任务统计不确定性</text></g></svg>