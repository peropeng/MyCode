<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350"><rect width="1200" height="350" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif" fill="#253642"><text x="36" y="36" font-size="25" font-weight="700">表5-2 失败任务恢复的共同运行条件</text><path d="M36 70 L1164 70" stroke="#253642" stroke-width="2.3"/><text x="45" y="103" font-size="24" font-weight="700">条件</text><text x="394.68" y="103" font-size="24" font-weight="700">统一设置</text><path d="M36 116 L1164 116" stroke="#253642" stroke-width="2.3"/><text x="45" y="149" font-size="24">任务起点</text><text x="394.68" y="149" font-size="24">同一原问题、仓库版本、失败代码及环境</text><text x="45" y="195" font-size="24">生成模型</text><text x="394.68" y="195" font-size="24">deepseek-flash；部署参数预先固定</text><text x="45" y="241" font-size="24">测试条件</text><text x="394.68" y="241" font-size="24">同代码和反馈许可、可见测试及独立验收</text><text x="45" y="287" font-size="24">运行设置</text><text x="394.68" y="287" font-size="24">共同时间及token上限；每题独立运行3次</text><path d="M36 300 L1164 300" stroke="#253642" stroke-width="2.3"/></g></svg>