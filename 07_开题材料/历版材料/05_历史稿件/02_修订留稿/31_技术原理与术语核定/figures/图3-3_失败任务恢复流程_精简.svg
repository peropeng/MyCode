"240.0" y="286" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">按责任次序选取历史编辑</text><text x="240.0" y="317" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">读取当前代码，加入可见反馈</text><text x="660.0" y="247" font-size="28" fill="#7B6B9E" font-weight="700" text-anchor="middle">生成候选补丁</text><text x="660.0" y="286" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">生成修改内容</text><text x="660.0" y="317" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">检查并应用到当前代码</text><text x="1080.0" y="247" font-size="26" fill="#AF713E" font-weight="700" text-anchor="middle">基于测试的补丁验证</text><text x="1080.0" y="286" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">运行可见目标测试和回归测试</text><text x="1080.0" y="317" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">检查已通过测试是否保持</text><text x="1485.0" y="247" font-size="25" fill="#A15F62" font-weight="700" text-anchor="middle">停止并保存状态</text><text x="1485.0" y="286" font-size="20" fill="#253642" font-weight="400" text-anchor="middle">保留此前代码</text><text x="1485.0" y="317" font-size="20" fill="#253642" font-weight="400" text-anchor="middle">记录结果不确定的原因</text><text x="365" y="180" font-size="20" fill="#456F99" font-weight="400" text-anchor="middle">排序与失败初态</text><text x="455" y="260" font-size="19" fill="#456F99" font-weight="400" text-anchor="middle">修复材料</text><text x="865" y="260" font-size="19" fill="#7B6B9E" font-weight="400" text-anchor="middle">应用成功</text><text x="1305" y="256" font-size="19" fill="#A15F62" font-weight="400" text-anchor="middle">缺失／未知</text><text x="1025.0" y="497" font-size="27" fill="#397F7C" font-weight="700" text-anchor="middle">采用候选修改</text><text x="1025.0" y="536" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">更新代码和已通过目标集合</text><text x="1440.0" y="497" font-size="27" fill="#A15F62" font-weight="700" text-anchor="middle">不采用该候选</text><text x="1440.0" y="536" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">恢复此前代码，保护集合不变</text><text x="1090" y="418" font-size="20" fill="#397F7C" font-weight="400" text-anchor="middle">保持条件满足</text><text x="1340" y="386" font-size="20" fill="#A15F62" font-weight="400" text-anchor="middle">保持条件不满足</text><text x="835.0" y="697" font-size="28" fill="#667E8C" font-weight="700" text-anchor="middle">检查停止条件</text><text x="835.0" y="736" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">目标全过、尝试到限或资源到限</text><text x="695" y="479" font-size="21" fill="#A15F62" font-weight="700" text-anchor="start">应用失败</text><text x="695" y="514" font-size="20" fill="#A15F62" font-weight="400" text-anchor="start">保留原代码</text><text x="695" y="547" font-size="20" fill="#A15F62" font-weight="400" text-anchor="start">记录错误反馈</text><text x="963" y="599" font-size="19" fill="#397F7C" font-weight="400" text-anchor="middle">更新后状态</text><text x="1280" y="623" font-size="19" fill="#A15F62" font-weight="400" text-anchor="middle">原状态及失败反馈</text><text x="1410.0" y="697" font-size="26" fill="#AF713E" font-weight="700" text-anchor="middle">选定交付并独立验收</text><text x="1410.0" y="736" font-size="20" fill="#253642" font-weight="400" text-anchor="middle">依据已有可见结果选择代码</text><text x="1410.0" y="767" font-size="20" fill="#253642" font-weight="400" text-anchor="middle">独立验收判断任务是否恢复成功</text><text x="1145" y="693" font-size="18" fill="#AF713E" font-weight="400" text-anchor="middle">达到停止条件</text><text x="402" y="691" font-size="20" fill="#456F99" font-weight="400" text-anchor="middle">未结束：带反馈进入下一轮</text><text x="830" y="820" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">保持条件：初态已通过的回归项及累计已通过的目标项继续通过。预算节点保存当时已选定的代码。</text></svg>