<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488"><rect width="1200" height="488" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif" fill="#253642"><text x="36" y="36" font-size="25" font-weight="700">表5-6 核心模块消融设计</text><path d="M36 70 L1164 70" stroke="#253642" stroke-width="2.3"/><text x="45" y="103" font-size="24" font-weight="700">研究问题</text><text x="270.6" y="103" font-size="24" font-weight="700">实验条件</text><text x="530.04" y="103" font-size="24" font-weight="700">相对完整方法的改动</text><path d="M36 116 L1164 116" stroke="#253642" stroke-width="2.3"/><text x="45" y="195" font-size="24">RQ1 责任排序</text><text x="270.6" y="149" font-size="24">Full</text><text x="530.04" y="149" font-size="24">完整责任步骤排序模型</text><text x="45" y="195" font-size="24"></text><text x="270.6" y="195" font-size="24">w/o RelProp</text><text x="530.04" y="195" font-size="24">跳过多关系门控传播，直接使用初始表示</text><text x="45" y="241" font-size="24"></text><text x="270.6" y="241" font-size="24">w/o StepCtx</text><text x="530.04" y="241" font-size="24">以全轨迹均值替代各步骤的上下文向量</text><text x="45" y="356" font-size="24">RQ2 失败任务恢复</text><text x="270.6" y="287" font-size="24">Full</text><text x="530.04" y="287" font-size="24">完整失败任务恢复流程</text><text x="45" y="333" font-size="24"></text><text x="270.6" y="333" font-size="24">w/o HistEdit</text><text x="530.04" y="333" font-size="24">移除历史编辑输入，保留当前代码和反馈</text><text x="45" y="379" font-size="24"></text><text x="270.6" y="379" font-size="24">w/o CurrentRead</text><text x="530.04" y="379" font-size="24">移除依据历史编辑的专门当前代码读取</text><text x="45" y="425" font-size="24"></text><text x="270.6" y="425" font-size="24">w/o TargetKeep</text><text x="530.04" y="425" font-size="24">移除累积目标保持条件，保留初始回归项保持</text><path d="M36 438 L1164 438" stroke="#253642" stroke-width="2.3"/></g></svg>