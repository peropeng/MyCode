<text x="960" y="57.6" font-size="32" text-anchor="middle" fill="#222222" style="fill:#222222" class="bold">总体目标</text>
<text x="960" y="93.60000000000001" font-size="30" text-anchor="middle" fill="#222222" style="fill:#222222">研究故障轨迹的根因排序，以及诊断信息如何支持运行故障恢复。</text>
<path d="M960,111.60000000000001 L960,126 L460,126 L460,149.4" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow-222)"/><path d="M960,111.60000000000001 L960,126 L1460,126 L1460,149.4" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow-222)"/><rect x="40" y="153" width="840" height="91.8" stroke="#365f91" stroke-width="2.4" fill="white"/>
