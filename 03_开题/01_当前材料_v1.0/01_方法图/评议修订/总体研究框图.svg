<text x="58" y="181.8" font-size="30" text-anchor="start" fill="white" style="fill:white" class="bold">研究目标1  提高根因排序质量</text>
<text x="61" y="228.6" font-size="29" text-anchor="start" fill="#222222" style="fill:#222222">结合分散证据，为历史步骤检查提供次序</text>
