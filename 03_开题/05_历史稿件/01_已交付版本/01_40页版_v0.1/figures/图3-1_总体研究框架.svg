<text x="960" y="505" font-size="27" text-anchor="middle" fill="#222222" style="fill:#222222">步骤排序</text>
<text x="460" y="671.4" font-size="26" text-anchor="middle" fill="#222222" style="fill:#222222">输入：失败轨迹    输出：根因检查次序</text>
<text x="1460" y="671.4" font-size="26" text-anchor="middle" fill="#222222" style="fill:#222222">输入：排序、任务、代码与反馈    输出：交付代码</text>
<path d="M460,690.3000000000001 L460,720" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow-222)" /><path d="M1460,690.3000000000001 L1460,720" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#arrow-222)" /><rect x="40" y="723.6" width="840" height="160.20000000000002" stroke="#365f91" stroke-width="2.4" fill="white" />
