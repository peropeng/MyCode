<text x="58" y="752.4" font-size="30" text-anchor="start" fill="white" style="fill:white" class="bold">根因排序预期成果</text>
<text x="61" y="799.2" font-size="29" text-anchor="start" fill="#222222" style="fill:#222222">形成关系增强的上下文感知根因排序方法，</text>
<text x="61" y="837" font-size="29" text-anchor="start" fill="#222222" style="fill:#222222">评价定位质量、模块作用与诊断耗时。</text>
