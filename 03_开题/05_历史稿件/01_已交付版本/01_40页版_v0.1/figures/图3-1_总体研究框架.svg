<rect x="1040" y="723.6" width="840" height="38.7" stroke="#b8642d" stroke-width="2.4" fill="#b8642d" />
<text x="1058" y="752.4" font-size="30" text-anchor="start" fill="white" style="fill:white" class="bold">任务恢复预期成果</text>
<text x="1061" y="799.2" font-size="29" text-anchor="start" fill="#222222" style="fill:#222222">形成利用诊断信息继续修正失败初态的方法，</text>
<text x="1061" y="837" font-size="29" text-anchor="start" fill="#222222" style="fill:#222222">以独立验收结果评价失败任务恢复成功率。</text>
