"110" height="42" rx="3" fill="#F5F2FA" stroke="#7B6B9E" stroke-width="2" /><rect x="1045" y="745" width="680" height="85" rx="8" fill="#F5F2FA" stroke="#7B6B9E" stroke-width="2" /><rect x="50" y="950" width="1700" height="155" rx="8" fill="white" stroke="#AF713E" stroke-width="2" /><rect x="50" y="950" width="1700" height="61" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2" /><rect x="530" y="1170" width="740" height="110" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2" /><polyline points="235,125 235,170" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="235,488 235,565" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="235,665 235,735" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="420,770 470,770" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="720,357 720,431" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="592,480 671,480" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="848,480 769,480" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="720,603 720,529" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="970,770 1020,770" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="1160,365 1160,410" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="1522,365 1522,410" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="1385,515 1385,557" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="1385,720 1385,745" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="235,850 235,950" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="720,850 720,950" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="1385,850 1385,950" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="900,1105 900,1170" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)" /><text x="900.0" y="62" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">完整故障轨迹：步骤内容、智能体编号、记录结构及原步骤编号</text><text x="900.0" y="101" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">对已经结束的完整轨迹进行诊断</text><text x="235.0" y="210" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">步骤特征编码</text><text x="720.0" y="210" font-size="29" fill="#397F7C" font-weight="700" text-anchor="middle">门控多关系消息传递</text><text x="1385.0" y="210" font-size="29" fill="#7B6B9E" font-weight="700" text-anchor="middle">全局自注意力聚合</text><text x="99" y="325" font-size="21" fill="#456F99" font-weight="400" text-anchor="middle">步骤1</text><text x="180" y="325" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">步骤文本</text><text x="262" y="325" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">编号</text><text x="344" y="325" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">结构</text><text x="99" y="400" font-size="21" fill="#456F99" font-weight="400" text-anchor="middle">步骤i</text><text x="180" y="400" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">步骤文本</text><text x="262" y="400" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">编号</text><text x="344" y="400" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">结构</text><text x="99" y="475" font-size="21" fill="#456F99" font-weight="400" text-anchor="middle">步骤m</text><text x="180" y="475" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">步骤文本</text><text x="262" y="475" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">编号</text><text x="344" y="475" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">结构</text><text x="235.0" y="602" font-size="25" fill="#456F99" font-weight="700" text-anchor="middle">配对特征融合</text><text x="235.0" y="641" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">门控加权，再残差相加</text><text x="235.0" y="772" font-size="24" fill="#456F99" font-weight="700" text-anchor="middle">投影为初始表示 hᵢ⁽⁰⁾</text><text x="445" y="747" font-size="18" fill="#456F99" font-weight="400" text-anchor="middle">h⁽⁰⁾</text><text x="720" y="338" font-size="25" fill="#397F7C" font-weight="700" text-anchor="middle">j</text><text x="720" y="283" font-size="20" fill="#397F7C" font-weight="400" text-anchor="middle">相邻步骤</text><text x="565" y="488" font-size="25" fill="#397F7C" font-weight="700" text-anchor="middle">j</text><text x="565" y="433" font-size="20" fill="#397F7C" font-weight="400" text-anchor="middle">记录结构相同</text><text x="875" y="488" font-size="25" fill="#397F7C" font-weight="700" text-anchor="middle">j</text><text x="875" y="433" font-size="20" fill="#397F7C" font-weight="400" text-anchor="middle">动作结构相同</text><text x="720" y="638" font-size="25" fill="#397F7C" font-weight="700" text-anchor="middle">j</text><text x="720" y="683" font-size="20" fill="#397F7C" font-weight="400" text-anchor="middle">同一智能体</text><text x="720" y="477" font-size="25" fill="#397F7C" font-weight="700" text-anchor="middle">步骤 i</text><text x="720" y="511" font-size="24" fill="#397F7C" font-weight="400" text-anchor="middle">hᵢ</text><text x="720" y="730" font-size="24" fill="#397F7C" font-weight="400" text-anchor="middle">门控消息 → 关系内均值</text><text x="720" y="774" font-size="24" fill="#397F7C" font-weight="400" text-anchor="middle">关系通道加权 → 残差更新</text><text x="720" y="820" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">四类关系各取前后最近邻，连续更新两层</text><text x="995" y="747" font-size="21" fill="#397F7C" font-weight="400" text-anchor="middle">h</text><text x="1385" y="255" font-size="21" fill="#667E8C" font-weight="400" text-anchor="middle">以步骤 i 为例，对每个步骤重复下列计算</text><text x="1160.0" y="317" font-size="23" fill="#7B6B9E" font-weight="700" text-anchor="middle">当前步骤 hᵢ</text><text x="1160.0" y="356" font-size="20" fill="#253642" font-weight="400" text-anchor="middle">查询 qᵢ = WQ hᵢ</text><text x="1522.5" y="317" font-size="23" fill="#7B6B9E" font-weight="700" text-anchor="middle">全轨迹步骤 h₁ … hₘ</text><text x="1522.5" y="356" font-size="20" fill="#253642" font-weight="400" text-anchor="middle">键 kⱼ = WK hⱼ，值 vⱼ = WV hⱼ</text><text x="1385.0" y="447" font-size="25" fill="#7B6B9E" font-weight="700" text-anchor="middle">① 计算步骤 i 与各步骤的相关性</text><text x="1385.0" y="486" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">点积缩放后归一化：aᵢⱼ = softmaxⱼ(qᵢᵀkⱼ / √d)</text><text x="1385" y="586" font-size="24" fill="#7B6B9E" font-weight="700" text-anchor="middle">② 得到步骤 i 对全轨迹的一行权重</text><text x="1130" y="639" font-size="25" fill="#7B6B9E" font-weight="400" text-anchor="middle">aᵢ₁</text><text x="1130" y="680" font-size="19" fill="#667E8C" font-weight="400" text-anchor="middle">步骤1</text><text x="1300" y="639" font-size="25" fill="#7B6B9E" font-weight="400" text-anchor="middle">aᵢⱼ</text><text x="1300" y="680" font-size="19" fill="#667E8C" font-weight="400" text-anchor="middle">步骤j</text><text x="1640" y="639" font-size="25" fill="#7B6B9E" font-weight="400" text-anchor="middle">aᵢₘ</text><text x="1640" y="680" font-size="19" fill="#667E8C" font-weight="400" text-anchor="middle">步骤m</text><text x="1465" y="639" font-size="29" fill="#7B6B9E" font-weight="400" text-anchor="middle">…</text><text x="1385" y="712" font-size="20" fill="#7B6B9E" font-weight="400" text-anchor="middle">aᵢⱼ：读取步骤 j 的权重，所有权重之和为1</text><text x="1385" y="773" font-size="25" fill="#7B6B9E" font-weight="700" text-anchor="middle">③ 加权汇聚：zᵢ = Σⱼ aᵢⱼ vⱼ</text><text x="1385" y="807" font-size="23" fill="#7B6B9E" font-weight="400" text-anchor="middle">输出上下文 cᵢ = h̄ + WO(zᵢ − WV h̄)</text><text x="900.0" y="990" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">轨迹内步骤评分</text><text x="245" y="910" font-size="22" fill="#456F99" font-weight="400" text-anchor="start">初始表示 hᵢ⁽⁰⁾</text><text x="730" y="910" font-size="22" fill="#397F7C" font-weight="400" text-anchor="start">关系表示 hᵢ</text><text x="1395" y="910" font-size="22" fill="#7B6B9E" font-weight="400" text-anchor="start">步骤上下文 cᵢ</text><text x="900" y="1047" font-size="28" fill="#AF713E" font-weight="700" text-anchor="middle">拼接 [ hᵢ ， hᵢ⁽⁰⁾ ， cᵢ ， hᵢ − cᵢ ] → 共享MLP → 步骤得分 sᵢ</text><text x="900" y="1084" font-size="21" fill="#667E8C" font-weight="400" text-anchor="middle">h̄：轨迹均值，d：表示维度，WQ、WK、WV、WO：可学习的线性映射</text><text x="900.0" y="1207" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">根因排序</text><text x="900.0" y="1246" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">按得分降序输出步骤及原步骤编号</text><text x="270" y="1200" font-size="24" fill="#667E8C" font-weight="700" text-anchor="middle">训练监督</text><text x="270" y="1242" font-size="21" fill="#667E8C" font-weight="400" text-anchor="middle">轨迹内softmax交叉熵</text><text x="270" y="1278" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">每条轨迹一个根因步骤标签</text><text x="1510" y="1200" font-size="24" fill="#667E8C" font-weight="700" text-anchor="middle">三模型部署</text><text x="1510" y="1242" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">各模型先作轨迹内softmax</text><text x="1510" y="1278" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">概率等权平均后排序</text></svg>