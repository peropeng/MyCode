<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="910" viewBox="0 0 1920 910"><defs><marker id="arrow-667E8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#667E8C"/></marker></defs><rect width="1920" height="910" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><text x="960" y="45" font-size="31" fill="#AF713E" text-anchor="middle" font-weight="700">名称去重函数：人为构造的说明例，非实验结果</text><text x="960" y="94" font-size="28" fill="#253642" text-anchor="middle" font-weight="400">任务：比较时忽略大小写，输出保留第一次出现的原写法和顺序</text><rect x="55" y="135" width="290" height="82" rx="5" fill="white" stroke="#456F99" stroke-width="2"/><text x="200" y="168" font-size="23" fill="#456F99" text-anchor="middle" font-weight="700">步骤 1</text><text x="200" y="199" font-size="26" fill="#253642" text-anchor="middle" font-weight="400">阅读需求</text><path d="M350 176 L423 176" stroke="#667E8C" stroke-width="2.5" fill="none" marker-end="url(#arrow-667E8C)"/><rect x="435" y="135" width="290" height="82" rx="5" fill="white" stroke="#456F99" stroke-width="2"/><text x="580" y="168" font-size="23" fill="#456F99" text-anchor="middle" font-weight="700">步骤 2</text><text x="580" y="199" font-size="26" fill="#253642" text-anchor="middle" font-weight="400">读取函数</text><path d="M730 176 L803 176" stroke="#667E8C" stroke-width="2.5" fill="none" marker-end="url(#arrow-667E8C)"/><rect x="815" y="135" width="290" height="82" rx="5" fill="#F8EFE5" stroke="#AF713E" stroke-width="2"/><text x="960" y="168" font-size="23" fill="#AF713E" text-anchor="middle" font-weight="700">步骤 3</text><text x="960" y="199" font-size="26" fill="#253642" text-anchor="middle" font-weight="400">编辑去重逻辑</text><path d="M1110 176 L1183 176" stroke="#667E8C" stroke-width="2.5" fill="none" marker-end="url(#arrow-667E8C)"/><rect x="1195" y="135" width="290" height="82" rx="5" fill="white" stroke="#456F99" stroke-width="2"/><text x="1340" y="168" font-size="23" fill="#456F99" text-anchor="middle" font-weight="700">步骤 4</text><text x="1340" y="199" font-size="26" fill="#253642" text-anchor="middle" font-weight="400">运行测试</text><path d="M1490 176 L1563 176" stroke="#667E8C" stroke-width="2.5" fill="none" marker-end="url(#arrow-667E8C)"/><rect x="1575" y="135" width="290" height="82" rx="5" fill="white" stroke="#456F99" stroke-width="2"/><text x="1720" y="168" font-size="23" fill="#456F99" text-anchor="middle" font-weight="700">步骤 5</text><text x="1720" y="199" font-size="26" fill="#253642" text-anchor="middle" font-weight="400">记录失败</text><text x="960" y="260" font-size="24" fill="#667E8C" text-anchor="middle" font-weight="400">案例前提：第3步编辑为标注责任位置，并被排在可用编辑前列；没有模型实测排序</text><rect x="55" y="300" width="555" height="500" rx="6" fill="white" stroke="#456F99" stroke-width="2"/><text x="332.5" y="341" font-size="28" fill="#456F99" text-anchor="middle" font-weight="700">修复输入</text><rect x="650" y="300" width="650" height="500" rx="6" fill="white" stroke="#397F7C" stroke-width="2"/><text x="975.0" y="341" font-size="28" fill="#397F7C" text-anchor="middle" font-weight="700">保留原写法的候选修改</text><rect x="1340" y="300" width="525" height="500" rx="6" fill="white" stroke="#AF713E" stroke-width="2"/><text x="1602.5" y="341" font-size="28" fill="#AF713E" text-anchor="middle" font-weight="700">测试保持检查</text><text x="80" y="400" font-size="30" fill="#253642" text-anchor="start" font-weight="400">def unique_names(names):</text><text x="110" y="443" font-size="29" fill="#253642" text-anchor="start" font-weight="400">return list(dict.fromkeys(names))</text><text x="333" y="510" font-size="26" fill="#456F99" text-anchor="middle" font-weight="400">该编辑只按原字符串去重</text><text x="333" y="550" font-size="25" fill="#456F99" text-anchor="middle" font-weight="400">重新读取当前函数后再修改</text><text x="333" y="630" font-size="24" fill="#AF713E" text-anchor="middle" font-weight="400">错误候选：转成小写后直接输出</text><text x="333" y="670" font-size="23" fill="#AF713E" text-anchor="middle" font-weight="400">会改变原始写法，破坏已有回归项</text><text x="680" y="395" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">def unique_names(names):</text><text x="680" y="441" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">    seen, out = set(), []</text><text x="680" y="487" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">    for name in names:</text><text x="680" y="533" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">        key = name.casefold()</text><text x="680" y="579" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">        if key not in seen:</text><text x="680" y="625" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">            seen.add(key)</text><text x="680" y="671" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">            out.append(name)</text><text x="680" y="717" font-size="30" fill="#253642" text-anchor="start" font-weight="400" xml:space="preserve">    return out</text><text x="1602" y="405" font-size="25" fill="#AF713E" text-anchor="middle" font-weight="700">初始已通过的回归检查</text><text x="1602" y="446" font-size="24" fill="#253642" text-anchor="middle" font-weight="400">空输入得到空列表</text><text x="1602" y="483" font-size="24" fill="#253642" text-anchor="middle" font-weight="400">原写法和出现顺序保持</text><text x="1602" y="546" font-size="25" fill="#AF713E" text-anchor="middle" font-weight="700">待修复的目标检查</text><text x="1602" y="586" font-size="27" fill="#253642" text-anchor="middle" font-weight="400">["X","x","Y"]</text><text x="1602" y="628" font-size="27" fill="#253642" text-anchor="middle" font-weight="400">应得到 ["X","Y"]</text><text x="1602" y="701" font-size="24" fill="#397F7C" text-anchor="middle" font-weight="400">已有项继续通过才接纳</text><text x="1602" y="740" font-size="24" fill="#397F7C" text-anchor="middle" font-weight="400">目标仍失败则继续修复</text><path d="M610 550 L644 550" stroke="#667E8C" stroke-width="2.5" fill="none" marker-end="url(#arrow-667E8C)"/><path d="M1302 550 L1335 550" stroke="#667E8C" stroke-width="2.5" fill="none" marker-end="url(#arrow-667E8C)"/><text x="960" y="858" font-size="27" fill="#667E8C" text-anchor="middle" font-weight="400">历史记录说明修改来源，当前文件决定实际编辑对象，测试结果决定是否接纳</text></g></svg>