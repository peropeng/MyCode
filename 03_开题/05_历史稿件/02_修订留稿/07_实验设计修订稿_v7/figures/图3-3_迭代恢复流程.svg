<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="880" viewBox="0 0 1920 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,SimSun,sans-serif" fill="#111"><text x="960" y="38" font-size="34" text-anchor="middle">诊断引导的迭代恢复</text><rect x="40" y="70" width="400" height="100" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="240" y="112" font-size="27" text-anchor="middle">当前状态与任务要求</text><text x="240" y="150" font-size="22" text-anchor="middle">已接纳状态、目标及保护行为</text><rect x="520" y="70" width="330" height="100" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="685" y="112" font-size="27" text-anchor="middle">责任排序与历史轨迹</text><text x="685" y="150" font-size="22" text-anchor="middle">保留原始步骤身份</text><path d="M240 170V230" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M685 170V195H270V230" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="230" width="400" height="140" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="240" y="272" font-size="30" text-anchor="middle">1  组织当前恢复证据</text><text x="240" y="310" font-size="25" text-anchor="middle">对应当前对象与代码</text><text x="240" y="346" font-size="25" text-anchor="middle">纳入最新公开失败反馈</text><rect x="520" y="230" width="330" height="140" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="685" y="272" font-size="30" text-anchor="middle">2  生成候选动作</text><text x="685" y="310" font-size="25" text-anchor="middle">修复、受控撤销</text><text x="685" y="346" font-size="25" text-anchor="middle">或继续执行</text><rect x="930" y="230" width="400" height="140" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1130" y="272" font-size="30" text-anchor="middle">3  隔离执行与公开验证</text><text x="1130" y="310" font-size="25" text-anchor="middle">检查动作是否可应用</text><text x="1130" y="346" font-size="25" text-anchor="middle">观察目标与保护行为</text><rect x="1410" y="230" width="470" height="140" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1645" y="272" font-size="30" text-anchor="middle">4  判断接纳并管理状态</text><text x="1645" y="310" font-size="25" text-anchor="middle">满足保护条件：接纳新状态</text><text x="1645" y="346" font-size="25" text-anchor="middle">不满足或不确定：保留原状态</text><path d="M440 300H520" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M850 300H930" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1330 300H1410" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1645 370V475" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><path d="M1500,555L1645,475L1790,555L1645,635Z" fill="white" stroke="#222" stroke-width="2.5"/><text x="1645" y="543" font-size="26" text-anchor="middle">达到完成条件</text><text x="1645" y="585" font-size="26" text-anchor="middle">或资源上限？</text><path d="M1500 555H1330" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><text x="1410" y="534" font-size="26" text-anchor="middle">否</text><rect x="930" y="495" width="400" height="120" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1130" y="537" font-size="30" text-anchor="middle">记录本轮反馈</text><text x="1130" y="575" font-size="25" text-anchor="middle">执行结果、拒绝原因与当前状态</text><path d="M930 555H240V370" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><text x="578" y="520" font-size="26" text-anchor="middle">依据反馈重新组织证据</text><path d="M1645 635V680H1530V715" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><text x="1667" y="677" font-size="26" text-anchor="middle">是</text><rect x="1410" y="715" width="240" height="105" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1530" y="757" font-size="27" text-anchor="middle">选定交付状态</text><text x="1530" y="795" font-size="22" text-anchor="middle">按方法自身规则</text><path d="M1650 767H1710" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a)"/><rect x="1710" y="715" width="180" height="105" rx="6" fill="white" stroke="#222" stroke-width="2.5"/><text x="1800" y="757" font-size="26" text-anchor="middle">独立验收</text><text x="1800" y="795" font-size="21" text-anchor="middle">仅用于评价</text><text x="640" y="769" font-size="25" text-anchor="middle">独立验收的反馈不进入恢复循环；累计时间、调用与token不因状态回退而重置。</text></g></svg>