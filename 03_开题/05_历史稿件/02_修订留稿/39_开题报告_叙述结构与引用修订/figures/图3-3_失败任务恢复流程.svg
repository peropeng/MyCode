<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1535" viewBox="0 0 1300 1535" font-family="Microsoft YaHei,SimHei,sans-serif"><defs><marker id="a456F99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456F99"/></marker><marker id="a397F7C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#397F7C"/></marker><marker id="a7B6B9E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7B6B9E"/></marker><marker id="aAF713E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AF713E"/></marker><marker id="a667E8C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#667E8C"/></marker><marker id="aA15F62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A15F62"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="350" y="25" width="600" height="115" rx="8" fill="#F1F6FB" stroke="#456F99" stroke-width="2"/><rect x="350" y="175" width="600" height="120" rx="8" fill="#F1F6FB" stroke="#456F99" stroke-width="2"/><rect x="350" y="330" width="600" height="120" rx="8" fill="#F5F2FA" stroke="#7B6B9E" stroke-width="2"/><rect x="90" y="330" width="210" height="120" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2"/><rect x="350" y="505" width="600" height="130" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2"/><rect x="1030" y="505" width="240" height="130" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2"/><polygon points="650,690 890,780 650,870 410,780" fill="#FBF5EE" stroke="#AF713E" stroke-width="2.5"/><rect x="480" y="935" width="340" height="125" rx="8" fill="#EFF8F6" stroke="#397F7C" stroke-width="2"/><rect x="900" y="935" width="340" height="125" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2"/><circle cx="650" cy="1095" r="5" stroke="#667E8C" stroke-width="2" fill="#667E8C"/><polygon points="650,1130 900,1210 650,1290 400,1210" fill="#F4F7F9" stroke="#667E8C" stroke-width="2.5"/><rect x="350" y="1325" width="600" height="120" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2"/><polyline points="650,140 650,175" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="650,295 650,330" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)"/><polyline points="350,390 300,390" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="650,450 650,505" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)"/><polyline points="950,570 1030,570" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="650,635 650,690" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)"/><polyline points="650,870 650,935" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)"/><polyline points="890,780 1070,780 1070,935" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="650,1060 650,1095" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round"/><polyline points="1070,1060 1070,1095 650,1095" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round"/><polyline points="195,450 195,1095 650,1095" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round"/><polyline points="650,1100 650,1130" fill="none" stroke="#667E8C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a667E8C)"/><polyline points="400,1210 40,1210 40,235 350,235" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="650,1290 650,1325" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)"/><text x="650.0" y="62" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">初始化</text><text x="650.0" y="101" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">读取失败代码、执行轨迹与可见测试</text><text x="650.0" y="132" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">计算一次责任排序，记录初始通过项</text><text x="665" y="164" font-size="21" fill="#456F99" font-weight="400" text-anchor="start">排序与失败初态</text><text x="650.0" y="212" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">修复上下文构建</text><text x="650.0" y="251" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">按排序选取历史编辑，读取当前源码</text><text x="650.0" y="282" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">加入原问题与此前执行反馈</text><text x="665" y="319" font-size="21" fill="#7B6B9E" font-weight="400" text-anchor="start">修复上下文</text><text x="650.0" y="367" font-size="29" fill="#7B6B9E" font-weight="700" text-anchor="middle">生成并应用候选补丁</text><text x="650.0" y="406" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">生成修改内容，检查格式及匹配位置</text><text x="650.0" y="437" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">成功应用后得到候选代码 S′</text><text x="195.0" y="367" font-size="23" fill="#A15F62" font-weight="700" text-anchor="middle">保留此前代码</text><text x="195.0" y="406" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">记录应用错误</text><text x="325" y="317" font-size="19" fill="#A15F62" font-weight="400" text-anchor="middle">应用失败</text><text x="665" y="482" font-size="21" fill="#7B6B9E" font-weight="400" text-anchor="start">应用成功</text><text x="650.0" y="542" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">基于测试的补丁验证</text><text x="650.0" y="581" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">执行可见目标测试与回归测试</text><text x="650.0" y="612" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">记录各项测试的通过、失败及完整性</text><text x="1150.0" y="542" font-size="25" fill="#A15F62" font-weight="700" text-anchor="middle">中止并保存</text><text x="1150.0" y="581" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">保留此前代码</text><text x="1150.0" y="612" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">记录不确定原因</text><text x="990" y="535" font-size="18" fill="#A15F62" font-weight="400" text-anchor="middle">缺失或</text><text x="990" y="558" font-size="18" fill="#A15F62" font-weight="400" text-anchor="middle">未知</text><text x="665" y="667" font-size="21" fill="#AF713E" font-weight="400" text-anchor="start">结果完整、确定</text><text x="650" y="768" font-size="25" fill="#AF713E" font-weight="700" text-anchor="middle">保持条件满足？</text><text x="650" y="804" font-size="25" fill="#AF713E" font-weight="400" text-anchor="middle">B ∪ Hₜ ⊆ Pass(S′)</text><text x="678" y="907" font-size="23" fill="#397F7C" font-weight="400" text-anchor="middle">是</text><text x="975" y="760" font-size="23" fill="#A15F62" font-weight="400" text-anchor="middle">否</text><text x="650.0" y="972" font-size="28" fill="#397F7C" font-weight="700" text-anchor="middle">采用候选修改</text><text x="650.0" y="1011" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">更新当前代码</text><text x="650.0" y="1042" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">累计新通过的目标测试</text><text x="1070.0" y="972" font-size="28" fill="#A15F62" font-weight="700" text-anchor="middle">恢复此前代码</text><text x="1070.0" y="1011" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">不采用该候选</text><text x="1070.0" y="1042" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">已通过目标集合保持不变</text><text x="350" y="1077" font-size="20" fill="#A15F62" font-weight="400" text-anchor="middle">应用错误反馈</text><text x="735" y="1120" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">保存本轮反馈</text><text x="650" y="1198" font-size="25" fill="#667E8C" font-weight="700" text-anchor="middle">达到停止条件？</text><text x="650" y="1229" font-size="25" fill="#667E8C" font-weight="400" text-anchor="middle">目标全过／尝试或资源到限</text><text x="215" y="1186" font-size="21" fill="#456F99" font-weight="400" text-anchor="middle">否：携反馈进入下一轮</text><text x="670" y="1313" font-size="23" fill="#AF713E" font-weight="400" text-anchor="start">是</text><text x="650.0" y="1362" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">选定交付并独立验收</text><text x="650.0" y="1401" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">依据已有可见结果选择代码</text><text x="650.0" y="1432" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">独立验收判断失败任务是否恢复成功</text><text x="650" y="1489" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">保持条件：初态回归通过项及累计已通过目标须继续通过。</text><text x="650" y="1521" font-size="21" fill="#667E8C" font-weight="400" text-anchor="middle">B：初态回归通过集合；Hₜ：累计通过的目标集合。</text></svg>