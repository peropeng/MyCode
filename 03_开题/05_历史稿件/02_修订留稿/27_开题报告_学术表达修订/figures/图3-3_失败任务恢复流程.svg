"2.5" /><rect x="600" y="1160" width="350" height="108" rx="8" fill="#EFF8F6" stroke="#397F7C" stroke-width="2" /><rect x="1050" y="1160" width="350" height="108" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2" /><rect x="650" y="1340" width="700" height="170" rx="8" fill="#F4F7F9" stroke="#667E8C" stroke-width="2" /><rect x="1500" y="1340" width="420" height="165" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2" /><polyline points="650,110 270,240" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="1000,160 1000,240" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="480,320 650,320" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><polyline points="1000,400 1000,470" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="1350,540 1500,540" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)" /><polyline points="1000,610 1000,680" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)" /><polyline points="1350,750 1500,750" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)" /><polyline points="1000,820 1000,890" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)" /><polyline points="875,1033 775,1160" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)" /><polyline points="1125,1033 1225,1160" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)" /><polyline points="775,1268 775,1298" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" /><polyline points="1225,1268 1225,1298" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" /><polyline points="1920,540 1970,540 1970,1298" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" /><polyline points="775,1298 1970,1298" fill="none" stroke="#667E8C" stroke-width="2.7" stroke-linejoin="round" /><polyline points="1000,1298 1000,1340" fill="none" stroke="#667E8C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a667E8C)" /><polyline points="1350,1410 1500,1410" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)" /><polyline points="650,1410 520,1410 520,320 650,320" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)" /><text x="1000.0" y="67" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">恢复初始化</text><text x="1000.0" y="106" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">原问题、失败初态S₀、完整失败轨迹及可见测试</text><text x="1000.0" y="137" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">仅诊断一次；记录初态回归保持项B和已通过目标H₀</text><text x="270.0" y="277" font-size="27" fill="#456F99" font-weight="700" text-anchor="middle">历史编辑筛选</text><text x="270.0" y="316" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">按责任次序提取成功源码编辑</text><text x="270.0" y="347" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">按调用标识去重，逐轮扩展</text><text x="270.0" y="378" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">保存原始步骤索引及编辑差异</text><text x="1000.0" y="277" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">构建本轮修复输入</text><text x="1000.0" y="316" font-size="24" fill="#253642" font-weight="400" text-anchor="middle">原问题 + 历史编辑 + 当前代码 + 可见反馈</text><text x="1000.0" y="347" font-size="24" fill="#253642" font-weight="400" text-anchor="middle">按容量规则选入历史记录，每轮重新读取代码</text><text x="1000.0" y="507" font-size="29" fill="#7B6B9E" font-weight="700" text-anchor="middle">生成、检查并应用候选</text><text x="1000.0" y="546" font-size="24" fill="#253642" font-weight="400" text-anchor="middle">生成文件路径、待替换内容和修改内容</text><text x="1000.0" y="577" font-size="24" fill="#253642" font-weight="400" text-anchor="middle">检查路径许可、格式及唯一匹配，保存候选S′</text><text x="1710.0" y="507" font-size="28" fill="#A15F62" font-weight="700" text-anchor="middle">应用失败</text><text x="1710.0" y="546" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">保留当前接纳状态</text><text x="1710.0" y="577" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">将格式或应用错误写入反馈</text><text x="1000.0" y="717" font-size="29" fill="#7B6B9E" font-weight="700" text-anchor="middle">运行可见测试</text><text x="1000.0" y="756" font-size="24" fill="#253642" font-weight="400" text-anchor="middle">在候选快照上执行目标测试和回归测试</text><text x="1000.0" y="787" font-size="24" fill="#253642" font-weight="400" text-anchor="middle">按固定测试标识记录通过、失败及完整性</text><text x="1710.0" y="717" font-size="27" fill="#A15F62" font-weight="700" text-anchor="middle">停止并保存当前状态</text><text x="1710.0" y="756" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">测试缺失、超时或结果不确定</text><text x="1710.0" y="787" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">保留此前接纳代码及中断原因</text><text x="1425" y="728" font-size="20" fill="#A15F62" font-weight="400" text-anchor="middle">缺失／未知</text><text x="1000" y="973" font-size="25" fill="#AF713E" font-weight="700" text-anchor="middle">保护集合是否仍通过？</text><text x="1000" y="1009" font-size="25" fill="#AF713E" font-weight="400" text-anchor="middle">B ∪ Hₜ ⊆ Pass(S′)</text><text x="1110" y="883" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">结果完整确定</text><text x="775.0" y="1197" font-size="28" fill="#397F7C" font-weight="700" text-anchor="middle">接纳候选</text><text x="775.0" y="1236" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">Sₜ₊₁ ← S′；扩充Hₜ</text><text x="1225.0" y="1197" font-size="28" fill="#A15F62" font-weight="700" text-anchor="middle">拒绝候选</text><text x="1225.0" y="1236" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">回退至Sₜ；Hₜ保持不变</text><text x="810" y="1116" font-size="26" fill="#397F7C" font-weight="700" text-anchor="middle">是</text><text x="1190" y="1116" font-size="26" fill="#A15F62" font-weight="700" text-anchor="middle">否</text><text x="275" y="950" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">按固定测试标识比较通过集合</text><text x="275" y="985" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">通过项未增加时，</text><text x="275" y="1020" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">满足保持条件仍可接纳</text><text x="1000.0" y="1377" font-size="28" fill="#667E8C" font-weight="700" text-anchor="middle">过程记录与停止检查</text><text x="1000.0" y="1416" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">运行中到15／30／60分钟节点，保存当时选定交付</text><text x="1000.0" y="1447" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">目标全过、尝试到限或总资源到限时停止</text><text x="1000.0" y="1478" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">应用失败、接纳和拒绝分支均进入此处</text><text x="1710.0" y="1377" font-size="26" fill="#AF713E" font-weight="700" text-anchor="middle">选定交付并独立验收</text><text x="1710.0" y="1416" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">按已有可见结果选定最终交付</text><text x="1710.0" y="1447" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">最终交付及节点快照事后验收</text><text x="1710.0" y="1478" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">独立验收结果用于判断恢复成功</text><text x="1425" y="1388" font-size="22" fill="#AF713E" font-weight="400" text-anchor="middle">停止</text><text x="570" y="1368" font-size="23" fill="#456F99" font-weight="700" text-anchor="middle">继续</text><text x="1000" y="1590" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">B：初态已通过回归项；Hₜ：截至当前接纳状态累计通过的目标项；独立验收反馈与生成过程隔离</text></svg>