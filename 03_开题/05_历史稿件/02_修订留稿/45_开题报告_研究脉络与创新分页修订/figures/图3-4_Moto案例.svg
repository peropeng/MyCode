<?xml version='1.0' encoding='utf8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 830" width="2000" height="830"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#222222"/></marker></defs><rect x="0" y="0" width="2000" height="830" fill="#ffffff" stroke="none"/><text x="1000" y="68" fill="#171c20" font-family="Microsoft YaHei" font-size="44" font-weight="700" text-anchor="middle">诊断线索、当前修正与测试进展在同一任务中衔接</text><rect x="50" y="142" width="340" height="350" fill="#ffffff" stroke="#222222" stroke-width="2"/><rect x="50" y="142" width="340" height="78" fill="#eef3f8" stroke="#222222" stroke-width="2"/><text x="220" y="197" fill="#35639c" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="middle">失败初态</text><text x="220" y="278" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">创建目标失败</text><text x="220" y="333" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">删除、更新已通过</text><text x="220" y="388" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">列表回归已通过</text><text x="220" y="443" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">已有部分字段修改</text><path d="M 390 317 L 440 317" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="142" width="340" height="350" fill="#ffffff" stroke="#222222" stroke-width="2"/><rect x="440" y="142" width="340" height="78" fill="#eef3f8" stroke="#222222" stroke-width="2"/><text x="610" y="197" fill="#35639c" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="middle">诊断输入</text><text x="610" y="278" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">既有排序提供线索</text><text x="610" y="333" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">联系历史字段修改</text><text x="610" y="388" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">核对当前响应代码</text><text x="610" y="443" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">结合序列化异常</text><path d="M 780 317 L 830 317" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="142" width="340" height="350" fill="#ffffff" stroke="#222222" stroke-width="2"/><rect x="830" y="142" width="340" height="78" fill="#eef3f8" stroke="#222222" stroke-width="2"/><text x="1000" y="197" fill="#35639c" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="middle">候选修正</text><text x="1000" y="278" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">响应层转换为字典</text><text x="1000" y="333" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">再生成JSON响应</text><text x="1000" y="388" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">后端继续返回对象</text><text x="1000" y="443" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">保留原内部接口</text><path d="M 1170 317 L 1220 317" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/><rect x="1220" y="142" width="340" height="350" fill="#ffffff" stroke="#222222" stroke-width="2"/><rect x="1220" y="142" width="340" height="78" fill="#eef3f8" stroke="#222222" stroke-width="2"/><text x="1390" y="197" fill="#35639c" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="middle">进展保持</text><text x="1390" y="278" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">创建目标新增通过</text><text x="1390" y="333" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">删除、更新仍通过</text><text x="1390" y="388" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">列表回归仍通过</text><text x="1390" y="443" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">接纳并累积保护</text><path d="M 1560 317 L 1610 317" fill="none" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/><rect x="1610" y="142" width="340" height="350" fill="#ffffff" stroke="#222222" stroke-width="2"/><rect x="1610" y="142" width="340" height="78" fill="#eef3f8" stroke="#222222" stroke-width="2"/><text x="1780" y="197" fill="#35639c" font-family="Microsoft YaHei" font-size="42" font-weight="700" text-anchor="middle">交付与验收</text><text x="1780" y="278" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">反馈目标全部通过</text><text x="1780" y="333" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">选定当前交付</text><text x="1780" y="388" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">执行隔离验收</text><text x="1780" y="443" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">已发布结果为通过</text><rect x="50" y="554" width="1900" height="139" fill="#ffffff" stroke="#888888" stroke-width="2"/><text x="1000" y="603" fill="#171c20" font-family="Microsoft YaHei" font-size="38" font-weight="400" text-anchor="middle">另一开发候选：直接将后端改为字典，创建通过却破坏删除与更新。</text><text x="1000" y="660" fill="#171c20" font-family="Microsoft YaHei" font-size="38" font-weight="400" text-anchor="middle">按累计目标保持规则应拒绝；该对照来自另一条运行。</text><text x="1000" y="774" fill="#171c20" font-family="Microsoft YaHei" font-size="36" font-weight="400" text-anchor="middle">开发案例说明过程；排序收益与完整方法效果由共同实验检验。</text></svg>