00" y="1180" width="340" height="125" rx="8" fill="#FAF1F1" stroke="#A15F62" stroke-width="2"/><circle cx="650" cy="1370" r="5" stroke="#667E8C" stroke-width="2" fill="#667E8C"/><polygon points="650,1420 900,1500 650,1580 400,1500" fill="#F4F7F9" stroke="#667E8C" stroke-width="2.5"/><rect x="350" y="1660" width="600" height="120" rx="8" fill="#FBF5EE" stroke="#AF713E" stroke-width="2"/><polyline points="650,140 650,220" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="650,340 650,420" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)"/><polyline points="350,480 300,480" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="650,540 650,650" fill="none" stroke="#7B6B9E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a7B6B9E)"/><polyline points="950,715 1030,715" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="650,780 650,870" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)"/><polyline points="650,1050 650,1180" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a397F7C)"/><polyline points="890,960 1070,960 1070,1180" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aA15F62)"/><polyline points="650,1305 650,1370" fill="none" stroke="#397F7C" stroke-width="2.7" stroke-linejoin="round"/><polyline points="1070,1305 1070,1370 650,1370" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round"/><polyline points="195,540 195,1370 650,1370" fill="none" stroke="#A15F62" stroke-width="2.7" stroke-linejoin="round"/><polyline points="650,1375 650,1420" fill="none" stroke="#667E8C" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a667E8C)"/><polyline points="400,1500 40,1500 40,280 350,280" fill="none" stroke="#456F99" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#a456F99)"/><polyline points="650,1580 650,1660" fill="none" stroke="#AF713E" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#aAF713E)"/><text x="650.0" y="62" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">初始化</text><text x="650.0" y="101" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">读取失败代码、执行轨迹与可见测试</text><text x="650.0" y="132" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">计算一次责任排序，记录初始通过项</text><text x="665" y="188" font-size="21" fill="#456F99" font-weight="400" text-anchor="start">排序与失败初态</text><text x="650.0" y="257" font-size="29" fill="#456F99" font-weight="700" text-anchor="middle">修复上下文构建</text><text x="650.0" y="296" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">按排序选取历史编辑，读取当前源码</text><text x="650.0" y="327" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">加入原问题与此前执行反馈</text><text x="665" y="389" font-size="21" fill="#7B6B9E" font-weight="400" text-anchor="start">修复上下文</text><text x="650.0" y="457" font-size="29" fill="#7B6B9E" font-weight="700" text-anchor="middle">生成并应用候选补丁</text><text x="650.0" y="496" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">生成修改内容，检查格式及匹配位置</text><text x="650.0" y="527" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">成功应用后得到候选代码 S′</text><text x="195.0" y="457" font-size="23" fill="#A15F62" font-weight="700" text-anchor="middle">保留此前代码</text><text x="195.0" y="496" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">记录应用错误</text><text x="325" y="402" font-size="19" fill="#A15F62" font-weight="400" text-anchor="middle">应用失败</text><text x="665" y="600" font-size="21" fill="#7B6B9E" font-weight="400" text-anchor="start">应用成功</text><text x="650.0" y="687" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">基于测试的补丁验证</text><text x="650.0" y="726" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">执行可见目标测试与回归测试</text><text x="650.0" y="757" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">记录各项测试的通过、失败及完整性</text><text x="1150.0" y="687" font-size="25" fill="#A15F62" font-weight="700" text-anchor="middle">中止并保存</text><text x="1150.0" y="726" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">保留此前代码</text><text x="1150.0" y="757" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">记录不确定原因</text><text x="990" y="680" font-size="18" fill="#A15F62" font-weight="400" text-anchor="middle">缺失或</text><text x="990" y="703" font-size="18" fill="#A15F62" font-weight="400" text-anchor="middle">未知</text><text x="665" y="831" font-size="21" fill="#AF713E" font-weight="400" text-anchor="start">结果完整、确定</text><text x="650" y="948" font-size="25" fill="#AF713E" font-weight="700" text-anchor="middle">保持条件满足？</text><text x="650" y="984" font-size="25" fill="#AF713E" font-weight="400" text-anchor="middle">B ∪ Hₜ ⊆ Pass(S′)</text><text x="678" y="1115" font-size="23" fill="#397F7C" font-weight="400" text-anchor="middle">是</text><text x="975" y="940" font-size="23" fill="#A15F62" font-weight="400" text-anchor="middle">否</text><text x="650.0" y="1217" font-size="28" fill="#397F7C" font-weight="700" text-anchor="middle">采用候选修改</text><text x="650.0" y="1256" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">更新当前代码</text><text x="650.0" y="1287" font-size="22" fill="#253642" font-weight="400" text-anchor="middle">累计新通过的目标测试</text><text x="1070.0" y="1217" font-size="28" fill="#A15F62" font-weight="700" text-anchor="middle">恢复此前代码</text><text x="1070.0" y="1256" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">不采用该候选</text><text x="1070.0" y="1287" font-size="21" fill="#253642" font-weight="400" text-anchor="middle">已通过目标集合保持不变</text><text x="350" y="1352" font-size="20" fill="#A15F62" font-weight="400" text-anchor="middle">应用错误反馈</text><text x="735" y="1404" font-size="20" fill="#667E8C" font-weight="400" text-anchor="middle">保存本轮反馈</text><text x="650" y="1488" font-size="25" fill="#667E8C" font-weight="700" text-anchor="middle">达到停止条件？</text><text x="650" y="1524" font-size="25" fill="#667E8C" font-weight="400" text-anchor="middle">目标全过／尝试或资源到限</text><text x="215" y="1476" font-size="21" fill="#456F99" font-weight="400" text-anchor="middle">否：携反馈进入下一轮</text><text x="670" y="1628" font-size="23" fill="#AF713E" font-weight="400" text-anchor="start">是</text><text x="650.0" y="1697" font-size="29" fill="#AF713E" font-weight="700" text-anchor="middle">选定交付并独立验收</text><text x="650.0" y="1736" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">依据已有可见结果选择代码</text><text x="650.0" y="1767" font-size="23" fill="#253642" font-weight="400" text-anchor="middle">独立验收判断失败任务是否恢复成功</text><text x="650" y="1824" font-size="22" fill="#667E8C" font-weight="400" text-anchor="middle">保持条件：初态回归通过项及累计已通过目标须继续通过。</text><text x="650" y="1856" font-size="21" fill="#667E8C" font-weight="400" text-anchor="middle">B：初态回归通过集合；Hₜ：累计通过的目标集合。</text></svg>